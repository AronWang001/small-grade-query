# 将本文件内容放入站点 server 块内，或由宝塔的站点扩展配置 include。
location ~ ^/(?:config|database|storage|tools|vendor|app|deploy)(?:/|$) {
    deny all;
    return 404;
}

location ~ ^/(?:\.env|data\.json|AGENTS\.md|CHANGELOG\.md|README\.md)$ {
    deny all;
    return 404;
}

location ~* \.(?:sql|log|bak|ini)$ {
    deny all;
    return 404;
}

